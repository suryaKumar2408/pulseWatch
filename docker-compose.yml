# ═══════════════════════════════════════════════════════════════════════════
# PulseWatch — Docker Compose
#
# Services:
#   postgres  — Database
#   redis     — Queue broker + cache
#   backend   — Express API server
#   frontend  — React SPA (nginx in production; dev server locally)
#
# Usage:
#   docker compose up          # Start all services
#   docker compose up -d       # Start in background
#   docker compose logs -f     # Follow logs
#   docker compose down -v     # Tear down including volumes
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch}
      POSTGRES_DB:       ${POSTGRES_DB:-pulsewatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV:              production
      PORT:                  3000
      LOG_LEVEL:             ${LOG_LEVEL:-info}
      DATABASE_URL:          postgresql://${POSTGRES_USER:-pulsewatch}:${POSTGRES_PASSWORD:-pulsewatch}@postgres:5432/${POSTGRES_DB:-pulsewatch}
      REDIS_URL:             redis://redis:6379
      CORS_ORIGIN:           ${CORS_ORIGIN:-http://localhost,http://localhost:5173}
      JWT_SECRET:            ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN:        ${JWT_EXPIRES_IN:-7d}
      RATE_LIMIT_WINDOW_MS:  ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX:        ${RATE_LIMIT_MAX:-100}
      BCRYPT_ROUNDS:         ${BCRYPT_ROUNDS:-12}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
